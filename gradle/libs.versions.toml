[versions]
agp = "9.2.1"
kotlin = "2.4.20"
android-minSdk = "24"
android-compileSdk = "36"
kotlinxCoroutines = "1.11.0"
junit = "4.13.2"

[libraries]
kotlinx-coroutines      = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlin-test             = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
junit                   = { module = "junit:junit", version.ref = "junit" }

[plugins]
kotlinMultiplatform         = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
vanniktech-mavenPublish     = { id = "com.vanniktech.maven.publish", version = "0.37.0" }
# No version here -- both resolved once via pluginManagement.plugins{} in settings.gradle.kts
# (see that file's comment for why: declaring a version at each application site too conflicts
# once more than one plugin ID from the same implementation jar is applied in one build).
skainet-multiplatform       = { id = "sk.ainet.multiplatform" }
skainet-npmPins             = { id = "sk.ainet.npm-pins" }
