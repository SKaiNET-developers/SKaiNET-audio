GROUP=sk.ainet.audio
VERSION_NAME=0.1.0
POM_DESCRIPTION=SKaiNET audio - shared audio preprocessing and streaming utilities for the SKaiNET ASR family

POM_URL=https://github.com/SKaiNET-developers/SKaiNET-audio/
POM_SCM_URL=https://github.com/SKaiNET-developers/SKaiNET-audio
POM_SCM_CONNECTION=scm:git:git@github.com:SKaiNET-developers/SKaiNET-audio.git
POM_SCM_DEV_CONNECTION=scm:git:ssh@github.com:SKaiNET-developers/SKaiNET-audio.git

POM_LICENCE_NAME=MIT License
POM_LICENCE_URL=https://mit-license.org/
POM_LICENCE_DIST=repo

POM_DEVELOPER_ID=SKaiNET-developers
POM_DEVELOPER_NAME=SKaiNET development team
POM_DEVELOPER_URL=https://github.com/SKaiNET-developers/

# Maven Central (vanniktech maven publish plugin) — same flags as the SKaiNET engine repo.
mavenCentralPublishing=true
mavenCentralAutomaticPublishing=true
signAllPublications=true
SONATYPE_HOST=DEFAULT
SONATYPE_AUTOMATIC_RELEASE=false
RELEASE_SIGNING_ENABLED=true

#Gradle
kotlin.code.style=official
android.useAndroidX=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
