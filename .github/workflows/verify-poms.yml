name: Verify published POMs

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Set default permission for all jobs to none
permissions: {}

jobs:
  verify-poms:
    name: Publish to Maven local and validate POM coordinates
    # macOS: the modules declare Apple K/N targets, which only compile on a macOS host.
    runs-on: macOS-latest
    timeout-minutes: 60

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: 25

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Publish to Maven local
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
        run: |
          ./gradlew --no-daemon --stacktrace --no-configuration-cache \
            -PRELEASE_SIGNING_ENABLED=false \
            -PsignAllPublications=false \
            publishToMavenLocal

      - name: Validate POM coordinates
        run: ./.github/scripts/validate-published-poms.sh
